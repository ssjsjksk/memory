<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆漂流瓶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root{--color-bg:#0b1a39;--color-particle:#5f4b8b;--color-glow:#f5d6a5;--color-text:#dfe8f7}.font-title{font-family:'ZCOOL KuaiLe',cursive}body{font-family:'Noto Sans SC',sans-serif;background-color:var(--color-bg);color:var(--color-text);overflow:hidden}#three-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}.glass-ui{background:rgba(255,255,255,.05);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);border:1px solid rgba(223,232,247,.2);border-radius:1.5rem;box-shadow:0 8px 32px 0 rgba(11,26,57,.3)}.btn-glow{transition:all .3s ease;box-shadow:0 0 15px 0 var(--color-glow)}.btn-glow:hover{transform:scale(1.05);box-shadow:0 0 25px 5px var(--color-glow)}textarea::placeholder{color:rgba(223,232,247,.5)}textarea:focus{outline:none;border-color:var(--color-glow);box-shadow:0 0 10px 0 var(--color-glow)}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.animate-float{animation:float 6s ease-in-out infinite}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.animate-fadeIn{animation:fadeIn .8s ease-out forwards}.hidden{display:none}
    </style>
</head>
<body class="relative w-full h-screen overflow-hidden">
    <canvas id="three-bg"></canvas>
    <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-t-transparent border-white rounded-full animate-spin"></div>
        <p class="mt-4 text-lg text-white">正在潜入记忆之海...</p>
    </div>
    <div id="main-ui" class="relative z-10 flex items-center justify-center w-full h-full p-4">
        <button id="music-toggle" class="fixed top-6 right-6 z-50 p-2 rounded-full glass-ui text-white opacity-70 hover:opacity-100 transition-opacity hidden" title="切换音乐">
            <svg id="icon-music-on" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            <svg id="icon-music-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" x2="16" y1="9" y2="15"></line><line x1="16" x2="22" y1="9" y2="15"></line></svg>
        </button>
        <div id="home-view" class="text-center">
            <h1 class="font-title text-5xl md:text-7xl text-white mb-6 animate-float" style="text-shadow: 0 0 20px var(--color-glow);">让记忆在时光中漂流</h1>
            <div class="space-x-4">
                <button id="btn-write" class="btn-glow font-title text-xl px-8 py-4 bg-[var(--color-glow)] text-[var(--color-bg)] rounded-full transition-all duration-300 hover:bg-white">放入记忆</button>
                <button id="btn-read" class="btn-glow font-title text-xl px-8 py-4 bg-transparent border-2 border-[var(--color-glow)] text-[var(--color-glow)] rounded-full transition-all duration-300 hover:bg-[var(--color-glow)] hover:text-[var(--color-bg)]">拾取记忆</button>
            </div>
        </div>
        <div id="write-modal" class="glass-ui w-11/12 md:w-1/2 lg:w-1/3 p-8 rounded-3xl hidden">
            <h2 class="font-title text-3xl text-center text-white mb-6">写下你的记忆</h2>
            <textarea id="memory-textarea" class="w-full h-48 p-4 bg-transparent border-2 border-[var(--color-text)] rounded-xl text-white focus:border-[var(--color-glow)] transition-all duration-300 resize-none" placeholder="写下你想漂流的话..."></textarea>
            <p id="write-error" class="text-red-400 text-sm mt-2 hidden">漂流瓶不能为空哦。</p>
            <div class="flex justify-between items-center mt-6">
                <button class="btn-close px-6 py-2 text-gray-300 hover:text-white transition-colors">关闭</button>
                <button id="btn-submit" class="btn-glow px-8 py-3 bg-[var(--color-glow)] text-[var(--color-bg)] rounded-full font-bold transition-all duration-300">放入海中</button>
            </div>
        </div>
        <div id="read-modal" class="glass-ui w-11/12 md:w-1/2 lg:w-1/3 p-8 rounded-3xl hidden">
            <h2 class="font-title text-3xl text-center text-white mb-6">拾起的漂流瓶</h2>
            <div id="read-loading" class="text-center py-8">
                <div class="w-8 h-8 border-4 border-t-transparent border-white rounded-full animate-spin mx-auto"></div>
                <p class="mt-4 text-gray-300">正在从深海中打捞...</p>
            </div>
            <p id="read-empty" class="text-gray-400 text-center py-8 hidden">记忆之海暂时空空如也... 不如，你来放入第一个？</p>
            <div id="read-content-wrapper" class="max-h-[200px] overflow-y-auto"><p id="read-memory-content" class="text-white text-lg leading-relaxed whitespace-pre-wrap hidden"></p></div>
            <div class="flex justify-between items-center mt-6">
                <button class="btn-close px-6 py-2 text-gray-300 hover:text-white transition-colors">返回首页</button>
                <button id="btn-next" class="btn-glow px-8 py-3 bg-[var(--color-glow)] text-[var(--color-bg)] rounded-full font-bold transition-all duration-300">下一个瓶子</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, limit, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        // --- 这是你自己的钥匙，已经为你填好了 ---
        const firebaseConfig = {
          apiKey: "AIzaSyCsekG7liDAgUGmRXFptc1enxQ25GIVS0",
          authDomain: "memorydrifter-d4720.firebaseapp.com",
          projectId: "memorydrifter-d4720",
          storageBucket: "memorydrifter-d4720.firebasestorage.app",
          messagingSenderId: "961926341645",
          appId: "1:961926341645:web:e39ae44f08f1cb8b54a144",
          measurementId: "G-WLDBT0M5SH"
        };
        
        let db, auth, userId, scene, camera, renderer, particles, mouseX = 0, mouseY = 0, audioInitialized = false;
        const loadingOverlay = document.getElementById('loading-overlay'), homeView = document.getElementById('home-view'), writeModal = document.getElementById('write-modal'), readModal = document.getElementById('read-modal'), btnWrite = document.getElementById('btn-write'), btnRead = document.getElementById('btn-read'), btnSubmit = document.getElementById('btn-submit'), btnNext = document.getElementById('btn-next'), closeButtons = document.querySelectorAll('.btn-close'), memoryTextarea = document.getElementById('memory-textarea'), writeError = document.getElementById('write-error'), readLoading = document.getElementById('read-loading'), readContent = document.getElementById('read-memory-content'), readEmpty = document.getElementById('read-empty'), musicToggleBtn = document.getElementById('music-toggle'), iconMusicOn = document.getElementById('icon-music-on'), iconMusicOff = document.getElementById('icon-music-off');

        function checkReadyAndShow() {
            loadingOverlay.querySelector('div')?.classList.add('hidden');
            const p = loadingOverlay.querySelector('p');
            if(p){ p.textContent = "点击进入记忆之海"; p.classList.add('cursor-pointer', 'opacity-70', 'hover:opacity-100', 'animate-pulse'); }
            loadingOverlay.classList.add('cursor-pointer');
            loadingOverlay.addEventListener('click', async () => {
                await initAudio();
                loadingOverlay.classList.add('opacity-0');
                setTimeout(() => loadingOverlay.classList.add('hidden'), 500);
            }, { once: true });
        }

        async function initAudio(){if(audioInitialized)return;try{await Tone.start();const r=new Tone.Reverb(6).toDestination(),s=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'fmsine'},envelope:{attack:.8,release:4}}).connect(r),p=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:3,release:3}}).toDestination();p.volume.value=-9,p.connect(r);const n=["C3","G3","Eb3","Bb3"];new Tone.Loop(t=>s.triggerAttackRelease(n[Math.floor(Math.random()*n.length)],"2n",t),"1m").start("2m"),new Tone.Loop(t=>p.triggerAttackRelease(n[0],"8m",t),"8m").start(0),Tone.Transport.bpm.value=65,Tone.Transport.start(),audioInitialized=!0,musicToggleBtn.classList.remove("hidden")}catch(t){console.warn("音频初始化失败:",t)}}
        function initThree(){try{const e=document.getElementById("three-bg");renderer=new THREE.WebGLRenderer({canvas:e,antialias:!0,alpha:!0}),renderer.setSize(window.innerWidth,window.innerHeight),renderer.setPixelRatio(window.devicePixelRatio),scene=new THREE.Scene,scene.fog=new THREE.FogExp2(3093081,.0008),camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,.1,1e3),camera.position.z=30;const t=2e4,o=new Float32Array(3*t);for(let e=0;e<t;e++){const t=3*e,r=100,i=Math.random(),a=Math.random(),s=2*Math.PI*i,n=Math.acos(2*a-1);o[t]=r*Math.sin(n)*Math.cos(s),o[t+1]=r*Math.sin(n)*Math.sin(s),o[t+2]=r*Math.cos(n)}const r=new THREE.BufferGeometry;r.setAttribute("position",new THREE.BufferAttribute(o,3));const i=new THREE.PointsMaterial({size:.35,color:6245563,blending:THREE.AdditiveBlending,transparent:!0,opacity:.7});particles=new THREE.Points(r,i),scene.add(particles),window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight,camera.updateProjectionMatrix(),renderer.setSize(window.innerWidth,window.innerHeight)}),document.addEventListener("mousemove",e=>{mouseX=(e.clientX-window.innerWidth/2)/(window.innerWidth/2),mouseY=(e.clientY-window.innerHeight/2)/(window.innerHeight/2)}),animate()}catch(e){console.error("3D场景初始化失败:",e)}}
        function animate(){requestAnimationFrame(animate);const e=.00005*Date.now();particles&&(particles.rotation.y=.2*e),camera.position.x+=(5*mouseX-camera.position.x)*.02,camera.position.y+=(-5*mouseY-camera.position.y)*.02,camera.lookAt(scene.position),renderer.render(scene,camera)}

        async function initFirebase() {
            if (!firebaseConfig.apiKey) { console.error("Firebase配置为空！"); return; }
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                onAuthStateChanged(auth, user => { if(user) userId = user.uid; });
                await signInAnonymously(auth);
                checkReadyAndShow();
            } catch (error) { console.error("Firebase初始化失败:", error); }
        }

        function showView(id){[homeView,writeModal,readModal].forEach(v=>v.classList.add('hidden'));const v=document.getElementById(id);v&&v.classList.remove('hidden')}
        async function submitBottle(){const t=memoryTextarea.value.trim();if(""===t)return void writeError.classList.remove("hidden");btnSubmit.disabled=!0,btnSubmit.textContent="漂流中...";try{await addDoc(collection(db,"bottles"),{memory:t,createdAt:serverTimestamp(),senderId:userId}),showView("home-view")}catch(t){console.error("放入漂流瓶失败:",t),writeError.textContent="放入失败，请稍后再试。"}finally{btnSubmit.disabled=!1,btnSubmit.textContent="放入海中"}}
        async function fetchRandomBottle(){showView("read-modal"),readLoading.classList.remove("hidden"),readContent.classList.add("hidden"),readEmpty.classList.add("hidden"),btnNext.disabled=!0;try{const t=query(collection(db,"bottles"),orderBy("createdAt","desc"),limit(50)),e=await getDocs(t);if(e.empty)readEmpty.classList.remove("hidden");else{const t=e.docs[Math.floor(Math.random()*e.docs.length)];readContent.textContent=t.data().memory,readContent.classList.remove("hidden")}}catch(t){console.error("拾取漂流瓶失败:",t),readEmpty.textContent="打捞失败，请稍后再试。",readEmpty.classList.remove("hidden")}finally{readLoading.classList.add("hidden"),btnNext.disabled=!1}}
        
        btnWrite.addEventListener('click',()=>showView('write-modal'));
        btnRead.addEventListener('click',fetchRandomBottle);
        closeButtons.forEach(b=>b.addEventListener('click',()=>showView('home-view')));
        btnSubmit.addEventListener('click',submitBottle);
        btnNext.addEventListener('click',fetchRandomBottle);
        musicToggleBtn.addEventListener('click',()=>{Tone.Master.mute=!Tone.Master.mute;iconMusicOn.classList.toggle('hidden');iconMusicOff.classList.toggle('hidden')});

        initThree();
        initFirebase();
    </script>
</body>
</html>
